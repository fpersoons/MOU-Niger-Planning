# Planificateur Budgétaire Intrants Paludisme FY26-FY30 — React + Vite.
# Publié sur mou-niger-planning.netlify.app, puis proxifié par le
# portail ChemLink sous https://www.chemlink.app/MOU-Niger-Planning/
# (réécriture 200). Toutes les références internes sont relatives (base './').

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
